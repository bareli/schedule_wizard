run_valve:
  name: Run valve
  description: Open a valve (or switch/light/cover) for a given duration. Auto-closes when done.
  fields:
    entity_id:
      name: Entity
      description: The entity to open.
      required: true
      selector:
        entity:
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light
    duration_minutes:
      name: Duration (minutes)
      description: How long to keep the valve open. Falls back to the valve's default if omitted.
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: slider

stop_valve:
  name: Stop valve
  description: Close a valve immediately and cancel its auto-close timer.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light

add_valve:
  name: Add valve
  description: Register a valve with the scheduler.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light
    label:
      name: Label
      description: Used to match calendar event summaries.
      required: true
      example: "Front lawn"
      selector:
        text:
    default_duration_minutes:
      name: Default duration (minutes)
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
    enabled:
      name: Enabled
      required: false
      default: true
      selector:
        boolean:

    soak_run_minutes:
      name: Soak - max run (minutes)
      description: Split long runs into chunks of at most this many minutes. 0 disables cycle-and-soak.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
    soak_pause_minutes:
      name: Soak - pause (minutes)
      description: Pause between chunks so water soaks in. 0 disables cycle-and-soak.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
    moisture_entity:
      name: Moisture sensor
      description: Per-valve soil moisture sensor. Overrides the global moisture sensor for this valve.
      required: false
      selector:
        entity:
          domain: sensor
    moisture_attribute:
      name: Moisture attribute
      description: Read this attribute instead of the state (optional).
      required: false
      selector:
        text:
    moisture_threshold:
      name: Moisture skip threshold
      description: Skip this valve when moisture is at or above this value.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
    rain_exempt:
      name: Indoor (ignore rain)
      description: Global rain delay and rain skip don't apply to this valve. A per-valve rain delay still does.
      required: false
      selector:
        boolean:

remove_valve:
  name: Remove valve
  description: Unregister a valve and delete its schedules.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light

add_schedule:
  name: Add schedule
  description: Schedule a recurring run at a fixed time on selected days.
  fields:
    valve_entity_id:
      name: Valve entity
      required: true
      selector:
        entity:
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light
    time:
      name: Time
      description: HH:MM (24h) local time.
      required: true
      example: "06:30"
      selector:
        time:
    duration_minutes:
      name: Duration (minutes)
      required: true
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
    days:
      name: Days
      required: true
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    name:
      name: Name
      required: false
      selector:
        text:
    enabled:
      name: Enabled
      required: false
      default: true
      selector:
        boolean:

    conditions:
      name: Conditions
      description: >-
        Run only when all conditions hold. List of {entity_id, attribute (optional),
        operator (above | below | equals | not_equals), value}. An unavailable entity fails its condition.
      required: false
      example: '[{"entity_id": "binary_sensor.pool_cover", "operator": "equals", "value": "off"}]'
      selector:
        object:

update_schedule:
  name: Update schedule
  description: Patch an existing schedule by id. Any omitted field is left unchanged.
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: false
      selector:
        text:
    time:
      name: Time
      required: false
      example: "06:30"
      selector:
        time:
    duration_minutes:
      name: Duration (minutes)
      required: false
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
    days:
      name: Days
      required: false
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    enabled:
      name: Enabled
      required: false
      selector:
        boolean:

    conditions:
      name: Conditions
      description: >-
        Run only when all conditions hold. List of {entity_id, attribute (optional),
        operator (above | below | equals | not_equals), value}. An unavailable entity fails its condition.
      required: false
      example: '[{"entity_id": "binary_sensor.pool_cover", "operator": "equals", "value": "off"}]'
      selector:
        object:

remove_schedule:
  name: Remove schedule
  description: Delete a schedule by its id (find via list_config).
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      selector:
        text:

add_cycle:
  name: Add cycle
  description: Create a cycle that runs a list of valves sequentially.
  fields:
    name:
      name: Name
      description: Also used to match calendar events.
      required: true
      selector:
        text:
    steps:
      name: Steps
      description: Ordered list. Each step = entity_id + duration_minutes.
      required: true
      selector:
        object:
    enabled:
      name: Enabled
      required: false
      default: true
      selector:
        boolean:

update_cycle:
  name: Update cycle
  description: Patch an existing cycle. Any omitted field is left unchanged.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: false
      selector:
        text:
    steps:
      name: Steps
      required: false
      selector:
        object:
    enabled:
      name: Enabled
      required: false
      selector:
        boolean:

remove_cycle:
  name: Remove cycle
  description: Delete a cycle by id. Also deletes any schedules targeting it.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:

run_cycle:
  name: Run cycle
  description: Start a cycle now. Runs each step's valve for its duration, sequentially.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:

stop_cycle:
  name: Stop cycle
  description: Cancel a running cycle and close the currently open valve.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:

set_rain_delay:
  name: Set rain delay
  description: Skip all schedule and calendar runs for the next N hours.
  fields:
    hours:
      name: Hours
      required: true
      example: 24
      selector:
        number:
          min: 0.5
          max: 720
          step: 0.5
          unit_of_measurement: h
    entity_id:
      name: Valves (optional)
      description: Delay only these valves. Leave empty to delay all valves.
      required: false
      selector:
        entity:
          multiple: true
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light

clear_rain_delay:
  name: Clear rain delay
  description: Resume schedule and calendar runs immediately.
  fields:
    entity_id:
      name: Valves (optional)
      description: Clear only these valves' delay. Leave empty to clear the global delay.
      required: false
      selector:
        entity:
          multiple: true
          domain:
            - switch
            - valve
            - cover
            - input_boolean
            - light

pause_cycle:
  name: Pause cycle
  description: Pause an in-progress cycle. Current valve closes; remaining steps wait for resume.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:

resume_cycle:
  name: Resume cycle
  description: Resume a paused cycle from where it left off.
  fields:
    cycle_id:
      name: Cycle ID
      required: true
      selector:
        text:

list_config:
  name: List config
  description: Returns the registered valves, schedules, cycles, active runs, active cycles, and recent history.

stop_all:
  name: Stop all
  description: Stop every running valve, soak sequence and cycle, then close the master valve.
