name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Install Assist test deps pinned by the installed Home Assistant
        run: |
          pip install $(python -c "import importlib.util, json, os; d = importlib.util.find_spec('homeassistant.components.conversation').submodule_search_locations[0]; print(' '.join(json.load(open(os.path.join(d, 'manifest.json')))['requirements']))")
      - run: pytest -q
